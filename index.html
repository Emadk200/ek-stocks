<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EK Stocks Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col items-center p-6">
  <div class="w-full max-w-6xl mb-6">
    <!-- Header Section -->
    <div class="flex justify-between items-start mb-4">
      <!-- Left: Date + Static Note -->
      <div>
        <p id="date" class="text-sm text-gray-700 mb-2"></p>
        <div id="note" class="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded-lg text-sm text-gray-800 whitespace-pre-line">
📊 - البيانات محدثة بناءً على ملف المراقبة الأخير.
- بعض الأسعار تحتاج مراجعة يدوية في حال تأخر التحديث من المصدر.
- الرجاء مراجعة نسب النمو والأرباح قبل اتخاذ أي قرار استثماري.
        </div>
      </div>

<!-- Right: Refresh + Search -->
<div class="flex flex-col items-end space-y-2">
  <div class="flex items-center space-x-2">
    <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2">
      <span>🔄</span><span>تحديث البيانات</span>
    </button>
    <div id="loading-indicator" class="hidden text-sm text-gray-600 flex items-center">
      <svg class="animate-spin h-4 w-4 mr-2 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <span>جارٍ تحديث البيانات...</span>
    </div>
  </div>

  <input id="searchInput" type="text" placeholder="بحث..." class="border p-2 rounded-lg text-sm w-48">
</div>
</div>

    <!-- Table Section -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table id="dataTable" class="min-w-full text-sm text-left border-collapse">
          <thead class="bg-gray-800 text-white"></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Loading indicator -->
    <div id="loading" class="hidden text-center mt-4 text-gray-700 font-semibold">
      جاري تحميل البيانات...
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
