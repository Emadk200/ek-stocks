<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EK Stocks Dashboard</title>

  <!-- تنسيق Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- مكتبة SheetJS الرسمية لقراءة Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-800">
  <div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4 text-center">📊 EK Stocks Dashboard</h1>

    <div class="mb-4 text-center">
      <input type="file" id="fileInput" accept=".xlsx, .xls" class="border p-2 rounded">
    </div>
      <div id="searchContainer" class="text-right"></div>
      <div id="tableContainer" class="overflow-x-auto"></div>
 <!--- الكود الاصلي  <div id="tableContainer" class="overflow-x-auto shadow-lg rounded-lg bg-white p-4"></div> --->
  </div>

  <script src="script.js"></script>
</body>
</html>
