<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EK Stocks Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-6">

  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-4 text-center">📊 EK Stocks Dashboard</h1>

    <!-- التاريخ والوقت -->
    <div id="datetime" class="text-sm text-gray-600 mb-2 text-left"></div>

    <!-- مربع الملاحظات -->
    <div id="note" class="bg-gray-100 p-3 rounded-md text-sm text-gray-800 mb-6 leading-relaxed">
      <p>• يرجى تحديث الملف أسبوعيًا أو بعد التغييرات الجوهرية.</p>
      <p>• الأسعار المحدثة تعتمد على آخر بيانات السوق المتوفرة.</p>
      <p>• الأرقام مقربة لعدد عشريين والنسب المئوية مميزة بالعلامة %.</p>
    </div>

    <!-- جدول الأسهم -->
    <div class="overflow-x-auto">
      <table id="stockTable" class="min-w-full border border-gray-300 rounded-lg shadow-sm">
        <thead class="bg-gray-800 text-white"></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- مكتبة Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- ملف الجافاسكريبت -->
  <script src="script.js"></script>
</body>
</html>
