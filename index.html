<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EK Stocks Dashboard</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- XLSX library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Custom Script -->
  <script defer src="script.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-6">

  <!-- Header -->
  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 mb-1">📊 EK Stocks Dashboard</h1>
      <p id="date" class="text-sm text-gray-600"></p>
      <p id="note" class="text-sm text-gray-600 italic"></p>
    </div>

    <!-- Reload Button -->
    <button id="reloadBtn"
      class="mt-4 sm:mt-0 px-4 py-2 bg-blue-600 text-white rounded-md shadow hover:bg-blue-700 transition">
      🔄 Reload Data
    </button>
  </header>

  <!-- Search -->
  <div class="mb-4">
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search..."
      class="w-full sm:w-1/3 px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-200"
    />
  </div>

  <!-- Table -->
  <div id="tableContainer" class="overflow-x-auto rounded-lg shadow-md bg-white p-4"></div>

</body>
</html>
