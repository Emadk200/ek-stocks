<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 EK Stocks Dashboard</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- مكتبة Excel -->
 <!-- قديم مو شغال <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.19.3/xlsx.full.min.js"></script>  -->
   <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- ملف الجافاسكريبت -->
  <script defer src="script.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 p-6">
  <div class="max-w-7xl mx-auto">

    <h1 class="text-2xl font-bold text-center mb-4 text-blue-700">📈 EK Stocks Dashboard</h1>

    <!-- 🔹 القسم العلوي: التاريخ والرسالة -->
    <div class="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center gap-4 mb-4 bg-white p-4 rounded-xl shadow-sm">
      <div class="flex flex-col items-start">
        <span id="dateTime" class="font-medium text-blue-700"></span>
        <div class="flex items-center gap-2 mt-1">
          <span id="customMessage" class="italic text-gray-600"></span>
          <button id="editMessageBtn" class="text-xs text-blue-600 hover:underline">تعديل</button>
        </div>
        <input type="text" id="messageInput" class="hidden border border-blue-300 rounded px-2 py-1 text-sm mt-1 w-full" placeholder="اكتب ملاحظتك هنا..." />
      </div>

<style>
  /* تلوين الصفوف بالتناوب */
  table tbody tr:nth-child(odd) {
    background-color: #ffffff;
  }

  table tbody tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  /* فاصل خفيف بين الصفوف */
  table tbody tr {
    border-bottom: 1px solid #d1d5db; /* رمادي فاتح */
  }

  /* تأثير عند المرور بالماوس */
  table tbody tr:hover {
    background-color: #e0e7ff;
  }

  /* السطر الأخير (المجاميع / المتوسطات) */
  table tbody tr:last-child {
    background-color: #e8f0fe !important; /* أزرق فاتح */
    font-weight: bold;
  }

  /* حدود عامة للجدول */
  table {
    border: 1px solid #cbd5e0;
    border-collapse: collapse;
    width: 100%;
  }

  table th,
  table td {
    border: 1px solid #e5e7eb;
    padding: 8px 10px;
    text-align: center;
  }

  table th {
    background-color: #f1f5f9;
    font-weight: 600;
  }
</style>


      <!-- 🔹 اختيار ملف Excel -->
      <div>
        <input type="file" id="fileInput" accept=".xlsx, .xls" class="border p-2 rounded cursor-pointer bg-white shadow-sm" />
      </div>
    </div>

    <!-- 🔹 البحث -->
    <div class="flex justify-between items-center mb-4">
      <input type="text" id="searchInput" placeholder="🔍 بحث..." class="border rounded px-3 py-2 w-full sm:w-1/3 shadow-sm focus:ring-2 focus:ring-blue-300" />
    </div>

    <!-- 🔹 مكان الجدول -->
<!--   تنسيق من اليمين لليسار - خطأ <div id="tableContainer" class="overflow-x-auto bg-white rounded-xl shadow-sm p-4"> </div> -->
<div id="tableContainer" class="overflow-x-auto" dir="ltr"></div>

  </div>
</body>
</html>
