<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchlist Stocks Dashboard</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Excel Parsing Library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</head>
<body class="bg-gray-100 text-gray-900">

  <div class="max-w-7xl mx-auto p-6">

    <!-- Title -->
    <h1 class="text-3xl font-bold mb-6 text-center">Watchlist Stocks Dashboard</h1>

    <!-- Header Controls -->
    <div class="flex justify-between items-start mb-6">

      <!-- Left Section: Date + Multi-line Note -->
      <div class="w-1/2">
        <p id="current-date" class="text-sm text-gray-700 font-semibold mb-2"></p>

        <div id="note" class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-md text-sm text-gray-800 whitespace-pre-line leading-relaxed">
📊 - الأسعار يتم تحديثها حسب آخر ملف مراقبة تم رفعه.
- الأرقام تقريبية وقد تختلف حسب الجلسة أو مزود البيانات.
- هذه الصفحة للاستئناس فقط ولا تعتبر توصية بيع أو شراء.
        </div>
      </div>

      <!-- Right Section: Refresh + Search -->
      <div class="flex flex-col items-end space-y-2">

        <!-- Refresh Button + Loading Indicator -->
        <div class="flex items-center space-x-2">
          <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
            <span>🔄</span><span>تحديث البيانات</span>
          </button>

          <div id="loading-indicator" class="hidden text-sm text-gray-600 flex items-center">
            <svg class="animate-spin h-4 w-4 mr-2 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span>جارٍ التحديث...</span>
          </div>
        </div>

        <!-- Search Box -->
        <input id="searchInput" type="text" placeholder="بحث..." class="border p-2 rounded-md text-sm w-48 shadow-sm">
      </div>

    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table id="dataTable" class="min-w-full text-sm border-collapse">
          <thead class="bg-gray-800 text-white"></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- JavaScript Logic -->
  <script src="script.js"></script>

</body>
</html>
